<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset = "UTF-8">
		<meta name="viewport" content="width=device-width, intial-scale=1.0">
		<title>Cheese Festival Form</title> 
	</head> 
	
	<body>
        <header>
            <nav>
            </nav>
        </header>

        <main id="main">
            <form action="https://github.com/jgsielaff/LP5-Repository" method="POST">
                <p>
                    <label for="name">Name:</label>
                    <input type="text" name="name" id="name" placeholder="Enter your name" required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" placeholder="Enter your email" required>
                </p>

                <p>
                    <label for="phone">Phone:</label>
                    <input type="tel" name="phone" id="phone" placeholder="Enter your phone number" required>
                </p>

                <fieldset>
                    <legend>Which day will you attend?</legend>
                    <input type="radio" name="day" id="friday" value="friday">
                    <Label for="friday">Friday</Label>

                    <input type="radio" name="day" id="saturday" value="saturday">
                    <Label for="saturday">Saturday</Label>

                    <input type="radio" name="day" id="sunday" value="sunday">
                    <Label for="sunday">Sunday</Label>
                </fieldset>

                <label for="cheese">Cheese Preference:</label>
                <select name="cheese" id="cheese">
                    <optgroup label="Cheese Preference">
                        <option value="mild">Mild</option>
                        <option value="sharp">Sharp</option>
                        <option value="specialty">Specialty</option>
                    </optgroup>
                </select>

                <p>
                <label for="comments">Comments/Dietary Restrictions:</label>
                <textarea name="comments" id="comments" placeholder="Enter your comments here"></textarea>
                </p>
            </form>
        </main>

        <footer>
        </footer>
    </body>
</html>
